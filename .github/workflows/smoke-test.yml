      # bundle ships to every browser, gated entirely by RLS.
      NEXT_PUBLIC_SUPABASE_URL: https://lawcnetonjpzqkrrnbnq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhd2NuZXRvbmpwenFrcnJuYm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjA3MzUsImV4cCI6MjEwNDc5NjczNX0.RKTlhNOZeqyCr9MXg_0Ub2eXbHE4WJaGKP2SovhXgcI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
